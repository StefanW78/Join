<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/standart.css" />
<link rel="stylesheet" href="./css/sidebar-and-header-css.css" />
<link rel="stylesheet" href="./css/sidebar-and-header-responsiv.css" />

<link rel="stylesheet" href="./css/styles.css" />
<link rel="stylesheet" href="./css/board-responsiv.css" />
<link rel="stylesheet" href="./css/addTask.css" />
<link rel="stylesheet" href="./css/addTaskMobile.css" />
<link rel="stylesheet" href="./css/overlay.css" />

    <script type="module" src="./Js/auth-script.js"></script>

    <title>JOIN-PROJEKT</title>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo-area">
        <img class="logo" src="./assets/img/join-logo.svg" alt="" />
      </div>

      <nav class="nav">
        <a href="./summary.html" class="nav-item">
          <img src="./assets/img/summary-icon.svg" alt="" />
          Summary
        </a>
        <a href="./addTask.html" class="nav-item">
          <img src="./assets/img/addTask-icon.svg" alt="" />
          Add Task
        </a>
        <a href="./board.html" class="nav-item active">
          <img src="./assets/img/board-icon.svg" alt="" />
          Board
        </a>
        <a href="./contacts.html" class="nav-item">
          <img src="./assets/img/contacts-icon.svg" alt="" />
          Contacts
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./legalnotes.html">Legal notice</a>
      </div>
    </aside>

    <div class="header-and-content-div">
          <div class="header-div">
            <div class="header-content">
              <div class="header-img">
                <img
                  src="./assets/img/Logo_for_Favicon_construction.png"
                  alt="header-logo"
                />
              </div>

              <div class="header-title">Kanban Project Management Tool</div>

              <div class="user-header">
                <a class="help" href="./help.html">
                  <img src="./assets/img/help.svg" alt="help-logo" />
                </a>

                <div class="user-icon">
                  <button class="header-button" id="header-button">SM</button>
                </div>

                <div class="dropdown-menu d_none" id="dropdown-menu">
                  <a
                    class="help-switch hidden-on-desktop"
                    id="help-switch"
                    href="./help.html"
                  >
                    Help
                  </a>
                  <a href="./legalnotes.html">Legal notice</a>
                  <a href="./privacy.html">Privacy Policy</a>
                  <a href="" onclick="logout()">Log Out</a>
                </div>
              </div>
            </div>
          </div>

      <main class="content">
        <div class="board-header">
          <div class="board-box">
            <h1 class="board-title">Board</h1>
          </div>
          <div class="search-box">
            <input
              id="boardSearch"
              name="boardSearch"
              type="text"
              placeholder="Find Task"
            />
            <img src="./assets/img/search.svg" alt="" />
          </div>
          <button class="btn-add-task btn-add-plus openAddTaskBtn">
            Add task &nbsp;+
          </button>
          <button class="btn-add-task btn-add-plus plus-none openAddTaskBtn">
            <img src="./assets/img/search-add.svg" alt="" />
          </button>
        </div>

        <div class="board-columns">
          <div class="column" data-status="todo">
            <div class="column-header">
              <span>To do</span>
              <button class="plus-box openAddTaskBtn">+</button>
            </div>
            <div class="task-column" id="todoTasks"></div>
          </div>

          <div class="column" data-status="inProgress">
            <div class="column-header">
              <span>In progress</span>
              <button class="plus-box openAddTaskBtn">+</button>
            </div>
            <div class="task-column" id="inProgressTasks"></div>
          </div>

          <div class="column" data-status="awaitFeedback">
            <div class="column-header">
              <span>Await feedback</span>
              <button class="plus-box openAddTaskBtn">+</button>
            </div>
            <div class="task-column" id="awaitFeedbackTasks"></div>
          </div>

          <div class="column" data-status="done">
            <div class="column-header">
              <span>Done</span>
            </div>
            <div class="task-column" id="doneTasks"></div>
          </div>
        </div>
      </main>
    </div>

    <div id="cardOverlay" class="card-overlay">
      <div id="cardFormContainer" class="card-overlay-content"></div>
    </div>
    <div id="addTaskOverlay" class="add-task-overlay d_none">
      <div class="add-task-modal">
        <button id="closeAddTaskOverlay" class="add-task-close">×</button>
        <section id="addTaskContentTemplate" class="addTaskContent">
          <h1 class="addTaskTitle">Add Task</h1>

          <form class="taskForm" id="taskForm">
            <div class="formGrid">
              <div class="formColumn">
                <div class="formGroup">
                  <label for="taskTitle"
                    >Title<span class="required">*</span></label
                  >
                  <input
                    id="taskTitle"
                    type="text"
                    placeholder="Enter a title"
                  />
                  <p class="fieldError" id="taskTitleError"></p>
                </div>

                <div class="formGroup">
                  <label for="taskDescription">Description</label>
                  <textarea
                    id="taskDescription"
                    placeholder="Enter a Description"
                  ></textarea>
                </div>

                <div class="formGroup">
                  <label for="taskDate"
                    >Due date<span class="required">*</span></label
                  >
                  <div class="inputWithIcon">
                    <input
                      id="taskDate"
                      type="text"
                      placeholder="dd/mm/yyyy"
                      inputmode="numeric"
                      maxlength="10"
                    />
                    <img
                      src="./assets/img/calendar-icon.svg"
                      alt="calendar icon"
                    />
                  </div>
                  <p class="fieldError" id="taskDateError"></p>
                </div>
              </div>

              <div class="formDivider"></div>

              <div class="formColumn">
                <fieldset class="formGroup priorityGroup">
                  <legend>Priority</legend>

                  <div class="priorityButtons">
                    <button type="button" class="priorityBtn urgentBtn">
                      <span>Urgent</span>
                      <img src="./assets/img/PrioUP-icon.svg" alt="urgent" />
                    </button>

                    <button
                      type="button"
                      class="priorityBtn mediumBtn activeMedium"
                    >
                      <span>Medium</span>
                      <img
                        src="./assets/img/PrioMedium-icon.svg"
                        alt="medium"
                      />
                    </button>

                    <button type="button" class="priorityBtn lowBtn">
                      <span>Low</span>
                      <img src="./assets/img/PrioDown-icon.svg" alt="low" />
                    </button>
                  </div>
                </fieldset>

                <div class="formGroup">
                  <label for="assignedInput">Assigned to</label>
                  <div class="customDropdown" id="assignedDropdown">
                    <input
                      type="text"
                      class="dropdownButton"
                      id="assignedInput"
                      placeholder="Select contacts to assign"
                      autocomplete="off"
                    />

                    <div class="dropdownList d_none" id="assignedList"></div>
                  </div>

                  <div class="selectedContactsWrapper">
                    <div class="selectedContacts" id="selectedContacts"></div>
                    <div
                      class="moreContactsDropdown d_none"
                      id="moreContactsDropdown"
                    ></div>
                  </div>
                </div>

                <div class="formGroup">
                  <label for="categoryButton"
                    >Category<span class="required">*</span></label
                  >

                  <div class="customDropdown" id="categoryDropdown">
                    <button
                      type="button"
                      class="dropdownButton"
                      id="categoryButton"
                    >
                      Select task category
                    </button>

                    <div class="dropdownList d_none" id="categoryList">
                      <div
                        class="dropdownOption"
                        data-category="Technical Task"
                      >
                        Technical Task
                      </div>
                      <div class="dropdownOption" data-category="User Story">
                        User Story
                      </div>
                    </div>
                  </div>

                  <p class="fieldError" id="categoryError"></p>
                </div>

                <div class="formGroup">
                  <label for="subtasks">Subtasks</label>

                  <div class="subtaskInputWrapper">
                    <input
                      id="subtasks"
                      type="text"
                      placeholder="Add new subtask"
                    />

                    <div class="subtaskActions">
                      <button type="button" id="clearSubtaskBtn">×</button>
                      <div class="subtaskDivider"></div>
                      <button type="button" id="addSubtaskBtn">✓</button>
                    </div>
                  </div>

                  <div class="subtasksWrapper">
                    <ul class="subtaskList" id="subtaskList"></ul>
                    <div
                      class="moreSubtasksDropdown d_none"
                      id="moreSubtasksDropdown"
                    ></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="taskFooter">
              <p class="requiredText">
                <span class="required">*</span>This field is required
              </p>

              <div class="taskActions">
                <button type="button" class="clearBtn" id="clearTaskBtn">
                  Clear ✕
                </button>
                <button type="submit" class="createTaskBtn">
                  Create Task ✓
                </button>
              </div>
            </div>
          </form>
        </section>
      </div>
    </div>
    <div id="taskAddedOverlay" class="taskAddedOverlay d_none">
      <div class="taskAddedBox">
        <span>Task added to board</span>
        <img src="./assets/img/board-icon.svg" alt="Board icon" />
      </div>
    </div>
    <script type="module" src="./Js/addTask.js"></script>
    <script src="./Js/boardAddTaskOverlay.js"></script>
    <script type="module" src="./Js/userBadge.js"></script>
    <script src="./Js/boardTemplate.js"></script>
    <script type="module" src="./Js/board.js"></script>
    <script src="./Js/Sidebar-and-header-script.js"></script>
</html>
